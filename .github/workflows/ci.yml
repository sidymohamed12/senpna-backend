name: CI

# ═══════════════════════════════════════════════════════════════════
# Pipeline CI — SEN PharmaFlow (senpna-backand)
#
# 1) build-and-analyze : compile, tests unitaires + intégration,
#    couverture JaCoCo, analyse qualité SonarQube auto-hébergé (Quality Gate).
# 2) docker             : build de l'image Docker prod, scan de
#    vulnérabilités (Trivy), push vers GHCR (uniquement sur main).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   - SONAR_TOKEN : token généré sur votre serveur SonarQube auto-hébergé (My Account > Security)
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Annule les exécutions précédentes non terminées sur la même branche/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ═════════════════════════════════════════════════════════════════
  # JOB 1 — Build, tests, couverture, analyse SonarQube (auto-hébergé)
  #
  # ⚠️ runs-on: self-hosted — ce job DOIT tourner sur le runner installé
  # sur la même machine que le conteneur SonarQube (http://localhost:9000
  # n'est joignable que depuis cette machine). Un runner GitHub-hosted
  # classique (ubuntu-latest) ne peut PAS atteindre ce serveur.
  # ═════════════════════════════════════════════════════════════════
  build-and-analyze:
    name: Build, tests & analyse SonarQube
    # ℹ️ Pas de "services:" (postgres/redis) ici : ce mécanisme GitHub Actions
    # ne fonctionne que sur des runners Linux, pas sur macOS. Non bloquant
    # actuellement (profil "test" = H2 in-memory). Si un jour un test
    # @Tag("integration") a besoin d'un vrai Postgres/Redis, démarrez-les
    # manuellement sur la machine du runner via docker-compose.dev.yml
    # avant le déclenchement du workflow, ou passez ce job en runs-on: ubuntu-latest.
    runs-on: self-hosted

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 requis par SonarQube pour l'analyse du "new code"
          # et le blame git (auteur des issues).
          fetch-depth: 0

      - name: Configuration JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache des packages SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compilation, tests et couverture JaCoCo
        # Le profil "test" (H2 in-memory, sans Redis) est déjà forcé par
        # maven-failsafe-plugin dans le pom.xml — aucune surcharge nécessaire ici.
        run: mvn -B -ntp clean verify

      - name: Rapport des tests (JUnit)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Résultats des tests JUnit
          path: "target/surefire-reports/*.xml,target/failsafe-reports/*.xml"
          reporter: java-junit
          fail-on-error: false

      # ⚠️ SonarQube Community Build ne supporte QUE l'analyse de la
      # branche par défaut (pas de multi-branch ni de PR decoration —
      # ces fonctionnalités sont réservées aux éditions payantes, ou
      # disponibles via le plugin communautaire non-officiel
      # mc1arke/sonarqube-community-branch-plugin si besoin plus tard).
      # On limite donc l'analyse aux push sur main.
      - name: Analyse SonarQube (Quality Gate)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Upload du rapport de couverture JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload du jar buildé
        uses: actions/upload-artifact@v4
        with:
          name: senpna-jar
          path: target/*.jar
          retention-days: 7

  # ═════════════════════════════════════════════════════════════════
  # JOB 2 — Build & scan de l'image Docker (uniquement push sur main)
  # ═════════════════════════════════════════════════════════════════
  docker:
    name: Build & scan image Docker
    needs: build-and-analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées de l'image (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build de l'image (sans push, pour scan préalable)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # ne bloque pas le pipeline ; passer à "1" une fois le backlog de vulnérabilités traité

      - name: Upload des résultats Trivy vers GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push de l'image vers GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
