# ═══════════════════════════════════════════════════════════════════
# SEN PharmaFlow — Profil PROD
# Toutes les valeurs sensibles sont injectées via variables d'env.
# NE JAMAIS committer de secrets dans ce fichier.
# ═══════════════════════════════════════════════════════════════════

spring:
  application:
    name: senpna

  # ── Jackson ──────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ── Base de données ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: SenPnaHikari-Prod
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate # JAMAIS create/update en prod
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        generate_statistics: false

  # ── Flyway ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  # ── Redis ────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000

  # ── Mail (SMTP) — entièrement piloté par variables d'environnement ──
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

# ── Serveur ────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    connection-timeout: 20000

# ── STORAGE ────────────────────────────────────────────────────────
storage:
  provider: ${STORAGE_PROVIDER:r2}
  r2:
    account-id: ${STORAGE_R2_ACCOUNT_ID}
    access-key: ${STORAGE_R2_ACCESS_KEY}
    secret-key: ${STORAGE_R2_SECRET_KEY}
    public-url: ${STORAGE_R2_PUBLIC_URL}
    bucket: ${STORAGE_BUCKET}

# ── Logging JSON (Loki / ELK) ─────────────────────────────────────
logging:
  level:
    root: WARN
    ministere.sante.senpna: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: >-
      {"ts":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","lvl":"%-5level","reqId":"%X{requestId:-}",
      "userId":"%X{userId:-}","logger":"%logger{36}","msg":"%msg"}%n

# ── Actuator ───────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,metrics # env exclu — pas de secrets exposés
  endpoint:
    health:
      show-details: never

# ── Springdoc — DÉSACTIVÉ en prod ────────────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── Configuration applicative ──────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://senpharmaflow.gouv.sn}
  otp:
    length: 6
    ttl: PT10M
    cooldown: PT2M
    max-attempts: 3
  rate-limit:
    auth-limit: ${RATE_LIMIT_AUTH:10}
    auth-window-ms: ${RATE_LIMIT_AUTH_WINDOW:60000}
    api-limit: ${RATE_LIMIT_API:120}
    api-window-ms: ${RATE_LIMIT_API_WINDOW:60000}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:SEN PharmaFlow}
  # Cache Redis clé/valeur (cache-aside, à la demande — cf. AppProperties.CacheProperties).
  cache:
    medicament-ttl: ${CACHE_MEDICAMENT_TTL:PT10M}
    lot-ttl: ${CACHE_LOT_TTL:PT5M}
    stock-ttl: ${CACHE_STOCK_TTL:PT2M}
    mouvement-ttl: ${CACHE_MOUVEMENT_TTL:PT6H}
    user-ttl: ${CACHE_USER_TTL:PT5H}
    catalogue-ttl: ${CACHE_CATALOGUE_TTL:PT1M}
    projet-ttl: ${CACHE_PROJET_TTL:PT24H}
    actualite-ttl: ${CACHE_ACTUALITE_TTL:PT24H}
  clock:
    timezone: Africa/Dakar

application:
  title: SEN PharmaFlow
  version: "@project.version@"
