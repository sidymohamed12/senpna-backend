# ═══════════════════════════════════════════════════════════════════
# SEN PharmaFlow — Profil DEV
# ═══════════════════════════════════════════════════════════════════

spring:
  application:
    name: senpna

  # ── Jackson ──────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ── Base de données ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/senpna
    username: postgres
    password: SMS
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: SenPnaHikari-Dev

  # ── JPA / Hibernate ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100

  # ── Flyway ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Redis ────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5000

# ── Serveur ────────────────────────────────────────────────────────
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json

# ── Logging ────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    ministere.sante.senpna: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"

# ── Actuator ───────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,flyway
  endpoint:
    health:
      show-details: always

# ── Springdoc / Swagger — accessible à '/' ────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: / # Swagger accessible directement à la racine
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    try-it-out-enabled: true

# ── Configuration applicative ──────────────────────────────────────
app:
  jwt:
    secret: "dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-ok!!"
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  security:
    cors-allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
  otp:
    length: 6
    ttl: PT10M
    cooldown: PT2M
    max-attempts: 3
  rate-limit:
    auth-limit: 10
    auth-window-ms: 60000
    api-limit: 120
    api-window-ms: 60000

application:
  title: SEN PharmaFlow
  version: 1.0.0-dev
