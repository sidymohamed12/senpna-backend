user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    gzip on;
    gzip_types application/json text/plain;

    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

    upstream senpna_backend {
        server app:8080;
        keepalive 32;
    }

    # ── HTTP : redirection vers HTTPS + challenge ACME (Let's Encrypt) ──
    server {
        listen 80;
        server_name senpharmaflow.gouv.sn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name senpharmaflow.gouv.sn;

        ssl_certificate     /etc/letsencrypt/live/senpharmaflow.gouv.sn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/senpharmaflow.gouv.sn/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        client_max_body_size 20m;

        location /actuator/ {
            # Actuator réservé au réseau interne (reverse proxy amont / VPN)
            deny all;
        }

        location / {
            limit_req zone=api_zone burst=40 nodelay;

            proxy_pass http://senpna_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
